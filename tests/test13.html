<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BreakThis — Caja Negra WASM</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Share Tech Mono',monospace;background:#000;color:#0f0;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.terminal{width:600px;background:#0a0a0a;border:1px solid #333;border-radius:5px;box-shadow:0 0 20px rgba(0,255,0,0.1)}
.header{background:#111;padding:10px;border-bottom:1px solid #333;display:flex;gap:5px}
.dot{width:12px;height:12px;border-radius:50%;background:#333}
.dot:nth-child(1){background:#ff5f56}
.dot:nth-child(2){background:#ffbd2e}
.dot:nth-child(3){background:#27c93f}
.content{padding:20px;min-height:300px}
input{background:transparent;border:none;color:#0f0;font-family:inherit;font-size:1.2rem;outline:none;width:100px;border-bottom:1px solid #0f0;}
.row{margin-bottom:15px;font-size:1.2rem}
button{background:#0f0;color:#000;border:none;padding:5px 15px;font-family:inherit;cursor:pointer;font-weight:bold;margin-left:10px}
button:hover{background:#00cc00}
#msg{color:#ff5f56;margin-top:20px}

.success-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;z-index:1000;flex-direction:column}
.success-overlay.show{display:flex}
.success-overlay h2{font-size:3rem;color:#00ff88;animation:pulse 1s infinite}
.success-overlay p{color:#aaa;margin-top:10px;font-family:sans-serif}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
</style>
</head>
<body>

<div class="terminal">
  <div class="header">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>
  <div class="content">
    <div class="row">> Carga de módulo WebAssembly completada.</div>
    <div class="row">> La lógica de validación es inaccesible desde JS.</div>
    <div class="row">> Introduzca el PIN de 4 dígitos:</div>
    <div class="row" style="margin-top:30px">
      > <input type="number" id="pinInput" min="0" max="9999" placeholder="0000">
      <button onclick="check()">VERIFICAR</button>
    </div>
    <div id="msg"></div>
  </div>
</div>

<div class="success-overlay" id="overlay">
  <h2>🏆 ¡HACKEADO!</h2>
  <p>Has completado el Reto #13 — Caja Negra WASM</p>
  <p style="color:#00ff88;margin-top:20px;font-family:monospace">Vuelve a la página principal para continuar</p>
</div>

<script>
// El binario está compilado. La función "check_pin" retorna 1 si es correcto, 0 si no.
// pista: puedes acceder a window.wasmModule desde la consola.
const wasmCode = new Uint8Array([0x00, 0x61, 0x73, 0x6d, 0x01, 0x00, 0x00, 0x00, 0x01, 0x06, 0x01, 0x60, 0x01, 0x7f, 0x01, 0x7f, 0x03, 0x02, 0x01, 0x00, 0x07, 0x0d, 0x01, 0x09, 0x63, 0x68, 0x65, 0x63, 0x6b, 0x5f, 0x70, 0x69, 0x6e, 0x00, 0x00, 0x0a, 0x0b, 0x01, 0x09, 0x00, 0x20, 0x00, 0x41, 0xac, 0x42, 0x46, 0x0b]);

WebAssembly.instantiate(wasmCode).then(result => {
  window.wasmModule = result.instance.exports;
  document.getElementById('msg').innerHTML = "<span style='color:#0f0'>> wasmModule exports ready.</span>";
});

function check() {
  if (!window.wasmModule) return;
  const pin = parseInt(document.getElementById('pinInput').value);
  if (isNaN(pin)) return;
  
  // Ejecutamos la función oscura en WASM
  const isValid = window.wasmModule.check_pin(pin);
  
  if (isValid === 1) {
    document.getElementById('msg').innerHTML = "<span style='color:#0f0'>> PIN ACEPTADO.</span>";
    fetch('https://breakthis.logise1123.workers.dev/api/complete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ challenge: 13 })
    }).then(r=>r.json()).then(d=>{
      localStorage.setItem('breakthis_13', d.token);
      document.getElementById('overlay').classList.add('show');
    });
  } else {
    document.getElementById('msg').innerHTML = "> ACCESO DENEGADO.";
  }
}
</script>
</body>
</html>
